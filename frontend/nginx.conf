# ══════════════════════════════════════════════════════════════════
#  KIDORA — Nginx interne du conteneur FRONTEND
#  Sert le build statique React (SPA) avec cache agressif des assets.
#  Le routage SPA (fallback index.html) est géré ici.
# ══════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets fingerprintés (Vite) → cache 1 an immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker & manifest → jamais cachés agressivement
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers racine courts (favicon, robots, icons…)
    location ~* \.(?:svg|png|ico|webmanifest|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Fallback SPA : toutes les routes React → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Pas de logs pour les health checks internes
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
