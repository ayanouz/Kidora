# ══════════════════════════════════════════════════════════════════
#  KIDORA — Nginx reverse proxy (production)
#
#   Internet → Nginx → Frontend (React build, nginx interne)
#                    → Backend API (Fastify :4000)
#
#  HTTPS : placer les certificats dans docker/nginx/certs/
#          fullchain.pem + privkey.pem (ex : Let's Encrypt / certbot)
#  Sans certificats, le service démarre en HTTP uniquement (port 80).
# ══════════════════════════════════════════════════════════════════

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ──────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 2m;

    # ── Compression ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/rss+xml image/svg+xml font/woff2;

    # ── Rate limiting (défense en profondeur, en plus du backend) ─
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    # ── Upstreams ─────────────────────────────────────────────────
    upstream kidora_frontend {
        server frontend:80;
        keepalive 16;
    }
    upstream kidora_backend {
        server backend:4000;
        keepalive 16;
    }

    # ── Headers de sécurité (partagés, tous les serveurs) ─────────
    # Note CSP : 'unsafe-inline' requis pour les styles inline React (positionnement canvas).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # ══════════════════════════════════════════════════════════════
    #  HTTP (port 80) — redirect HTTPS si certs présents, sinon sert
    # ══════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Challenge Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Sitemap dynamique → Backend ───────────────────────────
        location = /sitemap.xml {
            proxy_pass http://kidora_backend/api/sitemap.xml;
            proxy_set_header Host $host;
        }

        # ── API → Backend ─────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://kidora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://kidora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ── Frontend (SPA) ────────────────────────────────────────
        location / {
            proxy_pass http://kidora_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }
    }

    # ══════════════════════════════════════════════════════════════
    #  HTTPS (port 443) — activer après avoir placé les certificats
    #  dans docker/nginx/certs/ (fullchain.pem + privkey.pem)
    # ══════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name ${DOMAIN};
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location /api/auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://kidora_backend; include /etc/nginx/conf.d/proxy-common.conf; }
    #     location /api/      { limit_req zone=api burst=40 nodelay;  proxy_pass http://kidora_backend; include /etc/nginx/conf.d/proxy-common.conf; }
    #     location /          { proxy_pass http://kidora_frontend;    include /etc/nginx/conf.d/proxy-common.conf; }
    # }
    #
    # Redirect 80 → 443 (à décommenter avec le bloc HTTPS) :
    # server { listen 80; server_name ${DOMAIN}; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 301 https://$host$request_uri; } }
}
